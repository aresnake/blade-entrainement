name: BLADE CI

on:
  push:
  pull_request:

jobs:
  static-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Verify headless-safe generator set
        run: python scripts/check_headless_generators.py
